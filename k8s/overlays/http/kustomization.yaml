# Plain-HTTP install — no certificate.
#
# For sites where TLS is already terminated in front of the cluster: a
# Cloudflare proxy (orange cloud) or tunnel, or any other reverse proxy. That is
# exactly the panel's REVERSE_PROXY=true, and install.sh picks this overlay
# automatically when it reads that out of the panel's .5stack-env.config.
#
# Nothing to add — the base ingresses are already HTTP-only. This overlay exists
# so the two installs are symmetric: one directory per mode, and the installer
# just points kustomize at one of them.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
