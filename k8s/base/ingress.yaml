# Two ingresses on the same host, split by path:
#   /api  -> backend, which validates the 5stack session cookie itself
#   /*    -> frontend static assets (remoteEntry.js)
# No forward-auth annotations: the backend exchanges the inbound cookie for an
# identity at /plugins/authorize, which fails closed even if this ingress is
# bypassed. The host must stay a subdomain of the panel or the browser never
# sends the cookie (SameSite=Lax). Forward-auth here also breaks the game-server
# API (/api/equipped/v5/*), which authenticates by invsim_apikey and has no
# cookie to present.
# CORS is handled by the apps themselves (backend: @fastify/cors; frontend:
# nginx add_header) — not here.
#
# No `tls:` here on purpose. The base IS the plain-HTTP install, for sites whose
# certificate is terminated upstream (Cloudflare proxy/tunnel or any reverse
# proxy — the panel's REVERSE_PROXY=true). The cert-manager install adds the tls
# blocks by patch instead; see ../overlays/https.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: inventory-api
  namespace: 5stack
  annotations:
    # ingress-nginx defaults to a 1MB request body, and without this the shared
    # paint composites (src/compositeStore.ts) are rejected with a 413 that never
    # reaches the backend — a lossless 2k albedo+rough/metal pair is a few MB,
    # and a 4k projected style more. MEASURED against this ingress: 0.5MB
    # reached the backend, 1.5MB returned 413.
    #
    # Card renders (~100KB) always fit, which is why the limit went unnoticed.
    # The backend caps the body itself per route (COMPOSITE_MAX_BYTES), so this
    # is the outer bound, not the only one.
    nginx.ingress.kubernetes.io/proxy-body-size: 64m
spec:
  ingressClassName: nginx
  rules:
    - host: ${INVENTORY_DOMAIN}
      http:
        paths:
          - backend:
              service:
                name: inventory-backend
                port:
                  number: 3000
            path: /api
            pathType: Prefix
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: inventory-frontend
  namespace: 5stack
spec:
  ingressClassName: nginx
  rules:
    - host: ${INVENTORY_DOMAIN}
      http:
        paths:
          - backend:
              service:
                name: inventory-frontend
                port:
                  number: 80
            path: /
            pathType: Prefix
