# Compatibility shim for the panel's ./custom.sh, which builds a directory
# root and so needs a kustomization here.
#
# Copy this whole k8s/ directory to 5stack-panel/custom/inventory/ and run
# `./custom.sh inventory` — the dir name matters, custom.sh derives the node
# label as `5stack-<dirname>` and the deployments pin to `5stack-inventory`.
#
# It defaults to the plain-HTTP install. If your panel terminates TLS at the
# cluster (REVERSE_PROXY=false), point this at overlays/https instead.
#
# ../install.sh doesn't use this file — it builds the overlay it picked
# directly, and picks it by reading the panel's REVERSE_PROXY for you.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - overlays/http
